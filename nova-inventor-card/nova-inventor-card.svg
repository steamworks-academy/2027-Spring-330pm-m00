<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056" role="img" aria-labelledby="card-title card-description">
  <title id="card-title">Nova's Inventor Card</title>
  <desc id="card-description">A one-page inventor card for Nova, a fictional kid with three imaginative inventions, a favorite color palette, and a friendly robot badge.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#2D4263" flood-opacity="0.12"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2D4263" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="header-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EC8F2"/>
      <stop offset="1" stop-color="#7E6BE8"/>
    </linearGradient>
    <linearGradient id="badge-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7B8"/>
      <stop offset="1" stop-color="#FFD169"/>
    </linearGradient>
  </defs>

  <!-- Paper -->
  <rect width="816" height="1056" fill="#FFF9ED"/>
  <circle cx="766" cy="32" r="86" fill="#E7F8FF" opacity="0.82"/>
  <circle cx="44" cy="1016" r="72" fill="#F0E9FF" opacity="0.78"/>
  <circle cx="746" cy="1018" r="28" fill="#D8F5E5" opacity="0.9"/>
  <path d="M46 214 C88 190 120 191 154 214" fill="none" stroke="#FFD169" stroke-width="8" stroke-linecap="round"/>

  <!-- Header -->
  <g filter="url(#shadow)">
    <rect x="48" y="42" width="720" height="162" rx="32" fill="url(#header-gradient)"/>
  </g>
  <rect x="76" y="66" width="160" height="32" rx="16" fill="#FFFFFF" opacity="0.95"/>
  <text x="156" y="88" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.3" fill="#3F4C9A">INVENTOR CARD</text>
  <text x="76" y="145" font-family="Trebuchet MS, Arial, sans-serif" font-size="43" font-weight="900" fill="#FFFFFF">NOVA</text>
  <text x="76" y="177" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="600" fill="#F7FBFF">Big ideas. Tiny tools. Huge imagination.</text>

  <!-- Friendly robot badge -->
  <g transform="translate(609 56)">
    <circle cx="79" cy="72" r="67" fill="url(#badge-gradient)" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M79 17 V7" stroke="#3F4C9A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="79" cy="5" r="6" fill="#FF766B"/>
    <rect x="34" y="31" width="90" height="78" rx="25" fill="#FFFFFF" stroke="#3F4C9A" stroke-width="5"/>
    <rect x="47" y="47" width="64" height="38" rx="15" fill="#D9F6FF" stroke="#3F4C9A" stroke-width="4"/>
    <circle cx="65" cy="65" r="6" fill="#3F4C9A"/>
    <circle cx="93" cy="65" r="6" fill="#3F4C9A"/>
    <path d="M64 77 Q79 91 94 77" fill="none" stroke="#FF766B" stroke-width="4" stroke-linecap="round"/>
    <path d="M34 60 H22 M124 60 H136" stroke="#3F4C9A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="18" cy="60" r="5" fill="#5EC8F2"/>
    <circle cx="140" cy="60" r="5" fill="#5EC8F2"/>
    <rect x="53" y="110" width="52" height="12" rx="6" fill="#3F4C9A"/>
    <path d="M45 121 L33 135 M113 121 L125 135" stroke="#3F4C9A" stroke-width="6" stroke-linecap="round"/>
    <text x="79" y="157" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="0.9" fill="#3F4C9A">ROBO-FRIEND</text>
  </g>

  <!-- Inventions heading -->
  <text x="72" y="246" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="1.8" fill="#3F4C9A">THREE BRIGHT IDEAS</text>
  <path d="M72 258 H744" stroke="#D9DFF0" stroke-width="3" stroke-linecap="round"/>

  <!-- Invention 1 -->
  <g filter="url(#soft-shadow)">
    <rect x="72" y="274" width="672" height="142" rx="26" fill="#E7F8FF" stroke="#B8E5F5" stroke-width="3"/>
  </g>
  <circle cx="130" cy="345" r="42" fill="#5EC8F2"/>
  <!-- cloud icon -->
  <path d="M105 354 C97 354 91 348 91 340 C91 332 98 326 106 326 C110 314 121 306 134 306 C149 306 161 318 162 333 C173 333 181 341 181 351 C181 360 173 368 163 368 H105 C96 368 89 362 89 354 Z" fill="#FFFFFF" stroke="#3F4C9A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M126 342 H146 M136 332 V352" stroke="#FFD169" stroke-width="4" stroke-linecap="round"/>
  <text x="192" y="318" font-family="Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="900" fill="#263B5B">Cloud-Pocket Backpack</text>
  <text x="192" y="351" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="600" fill="#3A5677">Keeps a tiny rain cloud in a zipper pocket.</text>
  <text x="192" y="379" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="600" fill="#3A5677">Pull it out, and a rainbow pops up!</text>
  <circle cx="706" cy="300" r="17" fill="#FFFFFF"/>
  <text x="706" y="307" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="900" fill="#3F4C9A">1</text>

  <!-- Invention 2 -->
  <g filter="url(#soft-shadow)">
    <rect x="72" y="434" width="672" height="142" rx="26" fill="#F1EDFF" stroke="#D5C8F5" stroke-width="3"/>
  </g>
  <circle cx="130" cy="505" r="42" fill="#806BE7"/>
  <!-- sneaker icon -->
  <path d="M99 508 C110 508 118 496 121 483 L132 483 C138 498 146 508 160 515 L174 522 C180 525 180 536 171 539 H104 C94 539 89 533 91 524 C92 516 95 511 99 508 Z" fill="#FFFFFF" stroke="#3F4C9A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M119 501 L149 515 M114 510 L145 523 M105 527 H166" fill="none" stroke="#FF766B" stroke-width="4" stroke-linecap="round"/>
  <path d="M129 476 L134 466 M143 477 L151 469" stroke="#FFD169" stroke-width="4" stroke-linecap="round"/>
  <text x="192" y="478" font-family="Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="900" fill="#263B5B">Glow-Go Sneakers</text>
  <text x="192" y="511" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="600" fill="#3A5677">Light up when you step.</text>
  <text x="192" y="539" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="600" fill="#3A5677">They point to the safest path to follow.</text>
  <circle cx="706" cy="460" r="17" fill="#FFFFFF"/>
  <text x="706" y="467" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="900" fill="#3F4C9A">2</text>

  <!-- Invention 3 -->
  <g filter="url(#soft-shadow)">
    <rect x="72" y="594" width="672" height="142" rx="26" fill="#EAFBF1" stroke="#BDE9D0" stroke-width="3"/>
  </g>
  <circle cx="130" cy="665" r="42" fill="#54C995"/>
  <!-- snack bot icon -->
  <rect x="101" y="632" width="58" height="61" rx="15" fill="#FFFFFF" stroke="#3F4C9A" stroke-width="4"/>
  <rect x="109" y="642" width="42" height="25" rx="10" fill="#D9F6FF" stroke="#3F4C9A" stroke-width="3"/>
  <circle cx="121" cy="654" r="4" fill="#3F4C9A"/>
  <circle cx="139" cy="654" r="4" fill="#3F4C9A"/>
  <path d="M119 675 Q130 684 141 675" fill="none" stroke="#FF766B" stroke-width="3" stroke-linecap="round"/>
  <path d="M130 625 V617 M113 630 L105 621 M147 630 L155 621" stroke="#3F4C9A" stroke-width="4" stroke-linecap="round"/>
  <path d="M105 696 H155" stroke="#FFD169" stroke-width="5" stroke-linecap="round"/>
  <text x="192" y="638" font-family="Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="900" fill="#263B5B">Snack-Saver Bot</text>
  <text x="192" y="671" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="600" fill="#3A5677">Keeps your snack crunchy and shares fairly.</text>
  <text x="192" y="699" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="600" fill="#3A5677">It gives the last cookie a perfect split.</text>
  <circle cx="706" cy="620" r="17" fill="#FFFFFF"/>
  <text x="706" y="627" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="900" fill="#3F4C9A">3</text>

  <!-- Palette -->
  <g filter="url(#soft-shadow)">
    <rect x="72" y="765" width="672" height="126" rx="26" fill="#FFFFFF" stroke="#E2DCCF" stroke-width="3"/>
  </g>
  <text x="101" y="801" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="1.5" fill="#3F4C9A">NOVA'S FAVORITE COLORS</text>
  <g font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="700" fill="#3A5677" text-anchor="middle">
    <circle cx="150" cy="839" r="18" fill="#5EC8F2" stroke="#FFFFFF" stroke-width="4"/>
    <text x="150" y="873">Sky Blue</text>
    <circle cx="300" cy="839" r="18" fill="#FFD169" stroke="#FFFFFF" stroke-width="4"/>
    <text x="300" y="873">Sunshine</text>
    <circle cx="450" cy="839" r="18" fill="#806BE7" stroke="#FFFFFF" stroke-width="4"/>
    <text x="450" y="873">Grape Purple</text>
    <circle cx="600" cy="839" r="18" fill="#54C995" stroke="#FFFFFF" stroke-width="4"/>
    <text x="600" y="873">Mint Green</text>
  </g>

  <!-- Footer superpower -->
  <rect x="72" y="922" width="672" height="76" rx="24" fill="#FFF1B7" stroke="#F2D77C" stroke-width="3"/>
  <circle cx="112" cy="960" r="22" fill="#FFFFFF"/>
  <path d="M112 946 L117 956 L128 957 L120 964 L122 975 L112 970 L102 975 L104 964 L96 957 L107 956 Z" fill="#FFD169" stroke="#3F4C9A" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="151" y="954" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="900" fill="#3F4C9A">INVENTOR SUPERPOWER:</text>
  <text x="151" y="979" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#263B5B">Asking, “What if?”</text>
  <text x="744" y="1030" text-anchor="end" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="700" fill="#7B87A1">Made for curious minds</text>
</svg>
